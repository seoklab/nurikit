name: Run clang tools

on:
  workflow_call:
    inputs:
      files-changed-only:
        description: "Lint only changed files, unless the lint config itself changed"
        type: boolean
        default: true
      version:
        type: string
        default: "23"

defaults:
  run:
    shell: bash

jobs:
  check-files:
    runs-on: ubuntu-latest
    if: ${{ inputs.files-changed-only }}
    outputs:
      config-changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **/.clang-*
            scripts/run_clang_tools.sh

  format-and-lint-changed:
    needs: check-files
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && inputs.files-changed-only && needs.check-files.outputs.config-changed == 'false' }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolchain

      - name: Configure with cmake
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNURI_BUILD_TESTING=OFF \
            -DNURI_PREBUILT_ABSL=ON \
            -S . -B build -G Ninja

      - uses: cpp-linter/cpp-linter-action@v2
        id: clang-tools
        with:
          version: ${{ inputs.version }}
          extensions: "cpp,hpp,c,h"
          style: file
          tidy-checks: ""
          database: build
          ignore: ".github|build|third-party|test|fuzz|bench"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fail fast
        if: ${{  steps.clang-tools.outputs.checks-failed > 0 }}
        run: echo "Some files failed the linting checks!" && exit 1

  format-and-lint-all:
    needs: check-files
    # runs-on: ubuntu-latest
    runs-on: [self-hosted, sandbox]
    if: ${{ !cancelled() && (!inputs.files-changed-only || needs.check-files.outputs.config-changed == 'true') }}

    steps:
      # - run: sudo apt-get install -y libeigen3-dev

      # - uses: lukka/get-cmake@latest
      #   with:
      #     cmakeVersion: "~3.22.0" # for Ubuntu 22.04

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - uses: actions/checkout@v7

      - name: Configure with cmake
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNURI_BUILD_TESTING=OFF \
            -DNURI_PREBUILT_ABSL=ON \
            -S . -B build -G Ninja

      - name: Run clang tools to all files
        run: |
          # wget https://apt.llvm.org/llvm.sh
          # chmod +x llvm.sh

          # VERS=${{ inputs.version }}
          # sudo ./llvm.sh $VERS
          # sudo apt-get install -y clang-tidy-$VERS clang-format-$VERS
          # sudo ln -sf clang-tidy-$VERS /usr/bin/clang-tidy
          # sudo ln -sf clang-format-$VERS /usr/bin/clang-format

          ./scripts/run_clang_tools.sh -c -j24
