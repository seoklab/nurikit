name: PR checks

on:
  pull_request:
    branches:
      - main
      - "release/**"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

defaults:
  run:
    shell: bash

jobs:
  check-want:
    uses: ./.github/workflows/_check-want.yaml

  test-and-coverage:
    needs: check-want
    if: ${{ needs.check-want.outputs.test == 'true' }}
    uses: ./.github/workflows/_test-and-coverage.yaml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-build-wheels:
    needs: check-want
    if: ${{ needs.check-want.outputs.test == 'true' }}
    uses: ./.github/workflows/wheels-matrix.yaml
    with:
      minimal: true

  run-clang-tools:
    needs: check-want
    if: ${{ needs.check-want.outputs.lint == 'true' }}
    uses: ./.github/workflows/_run-clang-tools.yaml

  commitlint:
    if: ${{ !endsWith(github.triggering_actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: pip install -U gitlint

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          gitlint --commits \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  conclusion:
    # commitlint is advisory only
    needs: [test-and-coverage, test-build-wheels, run-clang-tools]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - run: |
          if [[ $FAILED == 'true' ]]; then
            echo "PR checks failed."
            exit 1
          fi
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
