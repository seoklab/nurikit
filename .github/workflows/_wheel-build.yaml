name: Build wheels

on:
  workflow_call:
    inputs:
      python:
        type: string
        description: "Python version"
        required: true
      ccache:
        type: boolean
        description: "Cache compilations with ccache"
        default: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Wheel for ${{ inputs.python }}
    runs-on: ${{ contains(inputs.python, 'linux') && 'ubuntu-latest' || 'macos-latest' }}
    steps:
      - uses: lukka/get-cmake@latest
        with:
          # Linux -> for Ubuntu 22.04
          # macOS -> universal binary at least from 3.19.7
          cmakeVersion: ${{ contains(inputs.python, 'linux') && '~3.22.0' || '3.19.7' }}

      - uses: actions/download-artifact@v8
        with:
          name: sdist

      - uses: actions/download-artifact@v8
        with:
          name: libnuri-${{ contains(inputs.python, 'linux') && 'linux' || 'macosx' }}
          path: dist

      - run: |
          tar -xvf *.tar* --strip-components=1
          tar -xvf dist/*.tar* -C dist

      - uses: actions/checkout@v7
        with:
          path: git

      - if: ${{ inputs.ccache }}
        uses: ./git/.github/actions/ccache
        with:
          key: wheel-${{ inputs.python }}
          container: ${{ contains(inputs.python, 'linux') }}

      # The ccache action's post step still needs git/.github at job end.
      - run: |
          git/.github/scripts/setup-deps.sh
          mv git/docs .
          find git -mindepth 1 -maxdepth 1 ! -name .github -exec rm -rf {} +

      - id: resolve
        run: |
          if [[ $python == *linux* ]]; then
            project=/project
          else
            project="$(pwd)"
          fi
          echo "CMAKE_PREFIX_PATH=${project}/dist:${CMAKE_PREFIX_PATH}" >>"$GITHUB_ENV"
          echo "ldpath=${project}/dist/lib" >>"$GITHUB_OUTPUT"
        env:
          python: ${{ inputs.python }}

      - uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: ${{ inputs.python }}
          CIBW_ARCHS: "all"
          SKBUILD_CMAKE_ARGS:
            "-DCMAKE_INSTALL_RPATH=${{ steps.resolve.outputs.ldpath }};\
            -DNURI_BUILD_LIB=OFF;\
            -DNURI_PREBUILT_ABSL=OFF"  # absl bundled with libnuri

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ inputs.python }}
          path: wheelhouse/*.whl
